name: Build native iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: read

concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Run AppTests
    # Runs alongside the packaging job rather than gating it, so a simulator
    # hiccup still leaves an installable IPA to fall back on.
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Pick an available iOS simulator
        id: sim
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep iPhone

      - name: Run unit tests
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme AppTests \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData-Tests \
            CODE_SIGNING_ALLOWED=NO \
            test

  build-ipa:
    name: Package unsigned IPA
    # Liquid Glass APIs require the iOS 26 SDK supplied by the Tahoe image.
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Display active Xcode
        run: xcodebuild -version

      - name: Build arm64 iPhone application
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData-Device \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA and metadata
        run: |
          set -euo pipefail
          app_path='build/DerivedData-Device/Build/Products/Release-iphoneos/App.app'
          test -d "$app_path"
          mkdir -p build/Payload
          cp -R "$app_path" build/Payload/Monochrome.app
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/Monochrome-native-unsigned.ipa
          cd build
          shasum -a 256 Monochrome-native-unsigned.ipa > Monochrome-native-unsigned.ipa.sha256
          printf 'commit=%s\nminimum_ios=26.0\narchitecture=arm64\nnative_root=SwiftUI\n' "$GITHUB_SHA" > build-metadata.txt

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monochrome-native-${{ github.sha }}
          path: |
            build/Monochrome-native-unsigned.ipa
            build/Monochrome-native-unsigned.ipa.sha256
            build/build-metadata.txt
          if-no-files-found: error
          retention-days: 30
