name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Build iPhone application
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          app_path="build/DerivedData/Build/Products/Release-iphoneos/App.app"
          test -d "$app_path"
          mkdir -p build/Payload
          cp -R "$app_path" build/Payload/Monochrome.app
          cd build
          ditto -c -k --sequesterRsrc --keepParent Payload Monochrome-iOS-12.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monochrome-iOS-12-unsigned
          path: build/Monochrome-iOS-12.ipa
          if-no-files-found: error
          retention-days: 30
