name: Build native iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test native app and package IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Display active Xcode
        run: xcodebuild -version

      - name: Create iPhone 12 simulator
        id: simulator
        run: |
          set -euo pipefail
          runtime="$(xcrun simctl list runtimes -j | jq -r '.runtimes[] | select(.isAvailable == true and (.identifier | contains("iOS"))) | .identifier' | tail -1)"
          udid="$(xcrun simctl create 'Monochrome iPhone 12' com.apple.CoreSimulator.SimDeviceType.iPhone-12 "$runtime")"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: Run simulator tests first
        run: |
          set -euo pipefail
          xcodebuild test \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath build/DerivedData-Simulator \
            CODE_SIGNING_ALLOWED=NO

      - name: Build arm64 iPhone application
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData-Device \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA and metadata
        run: |
          set -euo pipefail
          app_path='build/DerivedData-Device/Build/Products/Release-iphoneos/App.app'
          test -d "$app_path"
          mkdir -p build/Payload
          cp -R "$app_path" build/Payload/Monochrome.app
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/Monochrome-native-unsigned.ipa
          cd build
          shasum -a 256 Monochrome-native-unsigned.ipa > Monochrome-native-unsigned.ipa.sha256
          printf 'commit=%s\nminimum_ios=15.0\narchitecture=arm64\nnative_root=SwiftUI\n' "$GITHUB_SHA" > build-metadata.txt

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monochrome-native-${{ github.sha }}
          path: |
            build/Monochrome-native-unsigned.ipa
            build/Monochrome-native-unsigned.ipa.sha256
            build/build-metadata.txt
          if-no-files-found: error
          retention-days: 30
